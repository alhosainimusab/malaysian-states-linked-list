name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build (warnings are errors)
        run: make CFLAGS="-std=c11 -Wall -Wextra -pedantic -Werror -O2"
      - name: Unit tests
        run: make test
      - name: Sanitizers (ASan + UBSan + leak check)
        run: make sanitize
      - name: Mutation check (tests must catch deliberate bugs)
        run: make mutation
